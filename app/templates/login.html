<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      display: flex;
      max-width: 1000px;
      width: 100%;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      min-height: 600px;
    }

    .left-panel {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ==========================
       WORD WHEEL (NO BOX)
       ========================== */

    :root {
      --row-h: 72px;
      --visible-rows: 5;
      --wheel-w: 420px;
    }

    .wheel-wrap {
      width: min(var(--wheel-w), 90%);
    }

    .wheel {
      position: relative;
      height: calc(var(--row-h) * var(--visible-rows));
      overflow: hidden;
      background: transparent;
      border: none;
    }

    .wheel ul {
      list-style: none;
      margin: 0;
      padding: 0;
      will-change: transform;
    }

    .wheel li {
      height: var(--row-h);
      line-height: var(--row-h);
      text-align: center;
      font-size: 56px;
      font-weight: 600;
      color: white;
      opacity: 0.18;
      transform: scale(0.96);
      letter-spacing: 0.4px;
      user-select: none;
      transition:
        opacity 260ms ease,
        transform 260ms ease,
        font-weight 260ms ease,
        text-shadow 260ms ease;
    }

    .wheel li.active {
      opacity: 1;
      font-weight: 700;
      transform: scale(1.02);
      text-shadow: 0 6px 18px rgba(255,255,255,0.25);
    }

    .fade-top,
    .fade-bot {
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      z-index: 2;
    }

    .fade-top {
      top: 0;
      height: calc(var(--row-h) * 1.6);
      background: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
    }

    .fade-bot {
      bottom: 0;
      height: calc(var(--row-h) * 1.6);
      background: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0));
    }

    /* ==========================
       RIGHT PANEL (LOGIN)
       ========================== */

    .right-panel {
      flex: 1;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 {
      font-size: 32px;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .login-box p {
      color: #718096;
      margin-bottom: 32px;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #4a5568;
      font-size: 14px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.1);
    }

    .forgot-password {
      text-align: right;
      margin-top: -16px;
      margin-bottom: 24px;
    }

    .forgot-password button {
      background: transparent;
      border: none;
      color: #1230AE;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
    }

    .forgot-password button:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .login-btn:disabled {
      opacity: 0.85;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .dots-loader {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 18px;
    }

    .dots-loader span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      animation: dotPulse 1s infinite ease-in-out;
      opacity: 0.45;
    }

    .dots-loader span:nth-child(1) { animation-delay: 0s; }
    .dots-loader span:nth-child(2) { animation-delay: 0.15s; }
    .dots-loader span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dotPulse {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.45;
      }
      40% {
        transform: translateY(-3px);
        opacity: 1;
      }
    }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      color: #718096;
      font-size: 14px;
    }

    .signup-link button {
      background: transparent;
      border: none;
      color: #1230AE;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .signup-link button:hover {
      text-decoration: underline;
    }

    .guest-link {
      text-align: center;
      margin-top: 10px;
    }

    .guest-btn {
      width: 100%;
      padding: 11px 14px;
      background: #ffffff;
      color: #1a202c;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .guest-btn:hover {
      background: #f8fafc;
    }

    #guest-btn:hover,
    #guest-btn:focus-visible {
      text-decoration: underline !important;
      text-underline-offset: 2px;
      text-decoration-thickness: 2px;
    }

    .form-message {
      margin-top: 16px;
      font-size: 14px;
      color: #dc2626;
      min-height: 18px;
    }

    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .left-panel { flex: 0 0 240px; }
      .wheel li { font-size: 40px; }
      :root { --row-h: 60px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="left-panel">
    <div class="wheel-wrap">
      <div class="wheel" id="wheel">
        <div class="fade-top"></div>
        <div class="fade-bot"></div>
        <ul id="list"></ul>
      </div>
    </div>
  </div>

  <div class="right-panel">
    <div class="login-box">
      <h1 id="form-title">Welcome back!</h1>
      <p id="form-subtitle">Please enter your details to sign in</p>

      <form id="auth-form" novalidate>
        <div class="form-group" id="name-group" style="display: none;">
          <label>First name</label>
          <input type="text" id="firstName" autocomplete="given-name">
        </div>

        <div class="form-group" id="last-group" style="display: none;">
          <label>Last name</label>
          <input type="text" id="lastName" autocomplete="family-name">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required>
        </div>

        <div class="form-group" id="confirm-group" style="display: none;">
          <label>Confirm password</label>
          <input type="password" id="confirmPassword">
        </div>

        <div class="forgot-password">
          <button type="button" id="forgot-btn">Forgot password?</button>
        </div>

        <button class="login-btn" id="submit-btn" type="submit">Sign in</button>
        <div class="form-message" id="form-message"></div>
      </form>

      <div class="signup-link">
        <span id="toggle-text">Don't have an account?</span>
        <button type="button" id="toggle-mode">Sign up</button>
      </div>

      <div class="guest-link" style="text-align:center; margin-top:8px; color:#718096; font-size:14px;">
        <button type="button" id="guest-btn" style="background:transparent;border:none;color:#1230AE;text-decoration:none;font-weight:600;cursor:pointer;padding:0;">Continue as Guest</button>
      </div>
    </div>
  </div>
</div>

<script>
  const baseWords = [
    "Hello",
    "Hola",
    "Bonjour",
    "Ciao",
    "नमस्ते",
    "你好",
    "안녕하세요"
  ];

  function shuffle(arr) {
    const first = arr[0];
    const rest = arr.slice(1);
    for (let i = rest.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [rest[i], rest[j]] = [rest[j], rest[i]];
    }
    return [first, ...rest];
  }

  const words = shuffle(baseWords);
  const pauseMs = 1100;
  const scrollMs = 650;

  const rowH = parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue("--row-h"));
  const visibleRows = parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue("--visible-rows"), 10);
  const mid = Math.floor(visibleRows / 2);

  const list = document.getElementById("list");
  const triple = [...words, ...words, ...words];
  triple.forEach(w => {
    const li = document.createElement("li");
    li.textContent = w;
    list.appendChild(li);
  });

  const items = Array.from(list.children);
  const n = words.length;

  let centerIndex = n;
  let isAnimating = false;

  function setTransition(on) {
    list.style.transition = on
      ? `transform ${scrollMs}ms cubic-bezier(.2,.8,.2,1)`
      : "none";
  }

  function render(index, animate) {
    const prev = list.querySelector(".active");
    if (prev) prev.classList.remove("active");
    items[index].classList.add("active");

    const offset = -((index - mid) * rowH);
    setTransition(animate);
    list.style.transform = `translateY(${offset}px)`;
  }

  function normalize() {
    if (centerIndex < n * 0.8) centerIndex += n;
    else if (centerIndex > n * 2.2) centerIndex -= n;
    else return;

    requestAnimationFrame(() => render(centerIndex, false));
  }

  function step() {
    if (isAnimating) return;
    isAnimating = true;

    centerIndex++;
    render(centerIndex, true);

    setTimeout(() => {
      normalize();
      isAnimating = false;
    }, scrollMs + 30);
  }

  function loop() {
    step();
    setTimeout(loop, pauseMs + scrollMs);
  }

  render(centerIndex, false);
  setTimeout(loop, pauseMs);

  const form = document.getElementById("auth-form");
  const toggleModeBtn = document.getElementById("toggle-mode");
  const toggleText = document.getElementById("toggle-text");
  const title = document.getElementById("form-title");
  const subtitle = document.getElementById("form-subtitle");
  const submitBtn = document.getElementById("submit-btn");
  const confirmGroup = document.getElementById("confirm-group");
  const nameGroup = document.getElementById("name-group");
  const lastGroup = document.getElementById("last-group");
  const message = document.getElementById("form-message");
  const forgotBtn = document.getElementById("forgot-btn");
  const guestBtn = document.getElementById("guest-btn");
  const BROWSER_SESSION_KEY = "falcon_browser_session_active";
  const LOGIN_DELAY_MIN_MS = 800;
  const LOGIN_DELAY_MAX_MS = 1200;
  const DOTS_LOADER_HTML = '<span class="dots-loader" aria-hidden="true"><span></span><span></span><span></span></span>';

  function randomLoginDelayMs() {
    return LOGIN_DELAY_MIN_MS + Math.floor(Math.random() * (LOGIN_DELAY_MAX_MS - LOGIN_DELAY_MIN_MS + 1));
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function setSubmitLoading(isLoading) {
    if (isLoading) {
      submitBtn.disabled = true;
      submitBtn.dataset.originalText = submitBtn.textContent;
      submitBtn.innerHTML = DOTS_LOADER_HTML;
      return;
    }

    submitBtn.disabled = false;
    submitBtn.textContent = submitBtn.dataset.originalText || (mode === "register" ? "Create account" : "Sign in");
    delete submitBtn.dataset.originalText;
  }

  let mode = "login";

  function clearAuthFields() {
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
    document.getElementById("firstName").value = "";
    document.getElementById("lastName").value = "";
    document.getElementById("confirmPassword").value = "";
  }

  function setMode(nextMode) {
    mode = nextMode;
    message.innerHTML = "";
    message.style.color = "#dc2626";

    if (mode === "register") {
      title.textContent = "Create account";
      subtitle.textContent = "Sign up to get started";
      submitBtn.textContent = "Create account";
      nameGroup.style.display = "block";
      lastGroup.style.display = "block";
      confirmGroup.style.display = "block";
      toggleText.textContent = "Already have an account?";
      toggleModeBtn.textContent = "Sign in";
      forgotBtn.style.visibility = "hidden";
    } else {
      title.textContent = "Welcome back!";
      subtitle.textContent = "Please enter your details to sign in";
      submitBtn.textContent = "Sign in";
      nameGroup.style.display = "none";
      lastGroup.style.display = "none";
      confirmGroup.style.display = "none";
      toggleText.textContent = "Don't have an account?";
      toggleModeBtn.textContent = "Sign up";
      forgotBtn.style.visibility = "visible";
    }
  }

  toggleModeBtn.addEventListener("click", () => {
    const nextMode = mode === "login" ? "register" : "login";
    clearAuthFields();
    setMode(nextMode);
  });

  forgotBtn.addEventListener("click", () => {
    message.style.color = "#dc2626";
    message.textContent = "Password reset isn't configured yet.";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (submitBtn.disabled) return;
    message.innerHTML = "";
    message.style.color = "#dc2626";
    setSubmitLoading(true);

    const payload = {
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    };

    if (mode === "register") {
      payload.firstName = document.getElementById("firstName").value.trim();
      payload.lastName = document.getElementById("lastName").value.trim();
      payload.confirmPassword = document.getElementById("confirmPassword").value;
    }

    try {
      await sleep(randomLoginDelayMs());

      const res = await fetch(mode === "login" ? "/login" : "/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      if (!res.ok || !data.ok) {
        message.style.color = "#dc2626";
        message.textContent = data.error || "Something went wrong.";
        setSubmitLoading(false);
        return;
      }

      if (mode === "register") {
        setSubmitLoading(false);
        message.style.color = "#16a34a";
        message.innerHTML = 'Account created! Click <a href="#" id="registerSuccessLoginLink" style="color:#1230AE;font-weight:600;text-decoration:underline;">here</a> to login';

        const registerSuccessLoginLink = document.getElementById("registerSuccessLoginLink");
        if (registerSuccessLoginLink) {
          registerSuccessLoginLink.addEventListener("click", (evt) => {
            evt.preventDefault();
            clearAuthFields();
            setMode("login");
          });
        }
        return;
      }

      const redirectTarget = data.redirect || "/";
      if (redirectTarget) {
        try { sessionStorage.setItem(BROWSER_SESSION_KEY, "1"); } catch {}
        window.location.href = redirectTarget;
        return;
      }

      setSubmitLoading(false);
    } catch (err) {
      message.textContent = "Network error. Please try again.";
      setSubmitLoading(false);
    }
  });

  if (guestBtn) {
    guestBtn.addEventListener("click", () => {
      window.location.href = "/records";
    });
  }
</script>

</body>
</html>
